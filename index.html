<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#191826">
    <meta name="description" content="An arcade driving sandbox set in a procedural sunset district.">
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA20lEQVR42mNkwAKWFE76z0ADENOfx4guxojN4poVs2hhP0NLRBqGQxiRLaeVxdgcAnMEE70th4UwLLSZGAYYMNLb9+hRMeAhMOAOYMEneb8lEqu4Ys1yggbj0ouunyYhQKzlgyIK8DqAmKCmxPdkhwAuS0i1nG5RgC8kmeiR8CgqB6iZ5egeBcQ4nmmggp6okpASi4nNwkzUCkpy1Q+/2pDU0GIaSMtJcgAhw8mxfPikAXJ9T3I5QIlFOEMgpj+PEdZjoXeLOKY/j3FwpAF6hwJy12zwdE4HqnsOAJV5X4OUjlGHAAAAAElFTkSuQmCC">
    <title>Mini Vice City</title>
  </head>
  <body>
    <main class="game" aria-label="Mini Vice City">
      <canvas id="world" aria-label="3D driving view" tabindex="-1"></canvas>
      <div class="hud" id="hud" hidden>
        <header class="brand">
          <span class="brand-kicker"><span></span> MINI</span>
          <h1>VICE<span>CITY</span></h1>
          <p>SOUTH BEACH</p>
        </header>

        <section class="wanted-panel panel" aria-label="Wanted status">
          <div class="panel-heading">
            <span>WANTED</span>
            <span class="status" id="police-mode" role="status">CLEAR</span>
          </div>
          <div class="stars" id="wanted-stars" aria-label="0 of 5 wanted stars" data-level="0">
            <span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span><span aria-hidden="true">★</span>
          </div>
          <div class="evade-track" id="evade" role="progressbar" aria-label="Evade progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </section>

        <section class="radar-panel panel" aria-labelledby="radar-label">
          <div class="panel-heading">
            <span id="radar-label">RADAR</span>
            <span class="radar-north">▲ N</span>
          </div>
          <canvas id="radar" width="340" height="340" aria-label="Map of nearby streets, vehicles and police search area"></canvas>
        </section>

        <nav class="controls panel" aria-label="Driving controls">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>Drive</span></span>
          <span><kbd>Space</kbd><span>Drift</span></span>
          <span><kbd>R</kbd><span>Recover</span></span>
        </nav>

        <section class="speed-panel panel" aria-label="Speedometer">
          <div class="panel-heading">
            <span>SPEED</span>
            <button id="reset" type="button" title="Restart the district"><span class="reset-icon" aria-hidden="true">↻</span> Reset</button>
          </div>
          <div class="speed-reading"><output id="speed">000</output><span>KM/H</span></div>
          <div class="speed-track" id="speed-track" aria-hidden="true"><span></span></div>
        </section>
      </div>
      <div class="loading" id="loading" role="status">Starting engine…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
